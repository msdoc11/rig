# rig: nginx для продакшена. Замените example.com, пути и версию PHP-FPM под свой сервер.
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/example.com
#   sudo ln -s /etc/nginx/sites-available/example.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                                   # одно соединение на все запросы страницы
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    root /var/www/example.com/public;           # наружу смотрит только public/
    index index.php;

    # загрузка файлов из форм: чуть больше 'uploads.max' в config.php (10 МБ)
    client_max_body_size 12m;

    # gzip/brotli для HTML, JSON переходов и rig.js
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # скрытые файлы (.env, .git, .osp) не отдаём
    location ~ /\. { deny all; }

    # статика из public/ отдаётся с долгим кешем; всё, чего нет на диске, уходит в index.php
    location ~* \.(css|js|mjs|svg|png|jpe?g|gif|webp|avif|ico|woff2?)$ {
        try_files $uri /index.php?$query_string;
        expires 30d;
        access_log off;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param RIG_ENV production;        # config.php: debug выключен, хаб на /_rig/hub
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    # хаб событий (rig push, deploy/rig-push.service): одно SSE-соединение на вкладку
    location /_rig/hub/ {
        proxy_pass http://127.0.0.1:35730/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;                     # события должны уходить сразу
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # любые другие .php из public/ не выполняем
    location ~ \.php$ { return 404; }
}
